[package]
name = "toss-meter"
version = "0.1.0"
edition = "2021"
description = "시스템 리소스 사용량(CPU, 메모리, GPU, 디스크, 네트워크, 온도 등) 측정 크레이트. 덱 데몬(tossd)과 호스트(toss-connector)가 공용으로 사용한다."
publish = false

[dependencies]
toss-proto = { path = "../proto" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }
