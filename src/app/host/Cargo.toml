[package]
name = "toss-connector"
version = "0.1.0"
edition = "2021"
description = "토스 프론트 스트림덱용 호스트 데몬 및 CLI. 덱에 접속해 상태(미디어 정보, 앨범 아트 등)를 전송하고 덱의 요청을 실행한다."
publish = false

[dependencies]
toss-proto = { path = "../proto" }
toss-meter = { path = "../meter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
